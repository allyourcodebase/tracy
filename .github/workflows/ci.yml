name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-latest
            target: x86_64-linux-gnu

          - os: ubuntu-latest
            target: x86_64-freebsd
          - os: ubuntu-latest
            target: x86_64-netbsd
          - os: ubuntu-latest
            target: x86_64-openbsd

          - os: macos-latest
            target: native
          - os: windows-latest
            target: native

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2

      - name: Build (linux, musl)
        if: matrix.target == 'x86_64-linux-musl'
        run: |
          zig build -Dtarget=${{ matrix.target }} -Dno-fileselector -fno-sys=libxkbcommon -Dxkb-config-root="" -Dx-locale-root=""
          zig build -Dtarget=${{ matrix.target }} -Dno-fileselector -Dlegacy

      - name: Build (linux, gnu)
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          zig build -Dtarget=${{ matrix.target }} -Dlinkage=dynamic -Dno-fileselector -fno-sys=libxkbcommon -Dxkb-config-root="" -Dx-locale-root=""
          zig build -Dtarget=${{ matrix.target }} -Dlinkage=dynamic -Dno-fileselector -Dlegacy

      - name: Build (freebsd, cross-compile)
        if: matrix.target == 'x86_64-freebsd'
        run: |
          zig build -Dtarget=${{ matrix.target }} -Dno-fileselector -fno-sys=libxkbcommon -Dxkb-config-root=/usr/local/share/X11/xkb -Dx-locale-root=/usr/local/lib/X11/locale
          zig build -Dtarget=${{ matrix.target }} -Dno-fileselector -Dlegacy

      - name: Build (netbsd, cross-compile)
        if: matrix.target == 'x86_64-netbsd'
        run: zig build -Dtarget=${{ matrix.target }} -Dno-fileselector

      - name: Build (openbsd, cross-compile)
        if: matrix.target == 'x86_64-openbsd'
        run: zig build -Dtarget=${{ matrix.target }} -Dno-fileselector

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: zig build -Dno-fileselector

      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        run: zig build -Doptimize=ReleaseFast

      - name: Test
        if: matrix.os != 'windows-latest'
        run: |
          zig build check-test -Dtarget=${{ matrix.target }}
          zig build check-test -Dtarget=${{ matrix.target }} -Don-demand
          zig build check-test -Dtarget=${{ matrix.target }} -Dmanual-lifetime
          zig build check-test -Dtarget=${{ matrix.target }} -Ddemangle

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: ${{ matrix.os }}
          path: zig-out
